[project]
name = "aiops-demo-apps"
version = "0.2.0"
description = "Controlled Phase 2 demo services and load generator"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic-settings==2.15.0",
  "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["order-service", "payment-service", "inventory-service", "load-generator"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
