[project]
name = "aiops-phase1"
version = "0.1.0"
description = "AIOps Phase 1 infrastructure and health foundations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "opensearch-py>=3,<4",
  "opentelemetry-api>=1.38,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.38,<2",
  "opentelemetry-sdk>=1.38,<2",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
